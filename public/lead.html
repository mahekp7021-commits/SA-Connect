<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S&A Connect Lead Page</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}
.wrap{max-width:680px;margin:auto;padding:28px 18px 50px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 5px 20px rgba(23,32,51,.08);margin-top:18px}
h1{margin:0;font-size:30px}
h2{margin-top:0}
.sub{color:#667085;line-height:1.5}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
input,select,textarea{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:12px;font:inherit;background:#fff}
textarea{min-height:120px;resize:vertical}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}
button:disabled{opacity:.6}
.msg{margin-top:14px;padding:12px;border-radius:10px}
.success{background:#e8f7ef;color:#087443}
.error{background:#fee4e2;color:#b42318}
.brand{font-size:13px;font-weight:700;color:#2563eb;margin-bottom:8px}
.hp{position:absolute;left:-9999px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">S&A CONNECT</div>
    <h1 id="businessName">Loading...</h1>
    <p class="sub" id="pageName">Please wait...</p>
  </div>

  <div class="card">
    <h2>Trader Enquiry</h2>
    <p class="sub">Fill in your trading details and our team will contact you.</p>

    <form id="leadForm">
      <label>Name *</label>
      <input name="name" maxlength="120" required>

      <label>Mobile *</label>
      <input name="phone" type="tel" maxlength="20" inputmode="tel" required>

      <label>Email</label>
      <input name="email" type="email" maxlength="160">

      <label>City *</label>
      <input name="city" maxlength="100" required>

      <label>State / Union Territory *</label>
      <select name="state" required>
        <option value="">Select State / UT</option>
        <option>Andaman and Nicobar Islands</option><option>Andhra Pradesh</option>
        <option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option>
        <option>Chandigarh</option><option>Chhattisgarh</option>
        <option>Dadra and Nagar Haveli and Daman and Diu</option><option>Delhi</option>
        <option>Goa</option><option>Gujarat</option><option>Haryana</option>
        <option>Himachal Pradesh</option><option>Jammu and Kashmir</option>
        <option>Jharkhand</option><option>Karnataka</option><option>Kerala</option>
        <option>Ladakh</option><option>Lakshadweep</option><option>Madhya Pradesh</option>
        <option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option>
        <option>Mizoram</option><option>Nagaland</option><option>Odisha</option>
        <option>Puducherry</option><option>Punjab</option><option>Rajasthan</option>
        <option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option>
        <option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option>
        <option>West Bengal</option>
      </select>

      <label>Trading Experience *</label>
      <select name="tradingExperience" required>
        <option value="">Select Trading Experience</option>
        <option>Beginner</option><option>Less than 1 year</option>
        <option>1-3 years</option><option>3-5 years</option><option>5+ years</option>
      </select>

      <label>Trader Status *</label>
      <select name="traderStatus" required>
        <option value="">Select Trader Status</option>
        <option>Active Trader</option><option>Inactive Trader</option>
        <option>Interested in Trading</option><option>Learning / Beginner</option>
      </select>

      <label>Loss Experience *</label>
      <select name="lossExperience" required>
        <option value="">Select Loss Experience</option>
        <option>No Loss</option><option>Small Loss</option>
        <option>Moderate Loss</option><option>Heavy Loss</option>
        <option>Prefer Not to Say</option>
      </select>

      <label>Loss Segment *</label>
      <select name="lossSegment" required>
        <option value="">Select Loss Segment</option>
        <option>Forex</option><option>Crypto</option><option>Stocks</option>
        <option>Options</option><option>Commodities</option><option>Multiple Segments</option>
      </select>

      <label>Trading Capital *</label>
      <select name="tradingCapital" required>
        <option value="">Select Trading Capital</option>
        <option>Below ₹50,000</option><option>₹50,000 - ₹1 Lakh</option>
        <option>₹1 Lakh - ₹5 Lakhs</option><option>₹5 Lakhs - ₹10 Lakhs</option>
        <option>Above ₹10 Lakhs</option><option>Prefer Not to Say</option>
      </select>

      <label>Topic *</label>
      <input name="topic" maxlength="200" required>

      <label>Message *</label>
      <textarea name="message" maxlength="1000" required></textarea>

      <input class="hp" name="website" tabindex="-1" autocomplete="off">

      <button id="submitButton" type="submit">Submit Enquiry</button>
      <div id="message" class="msg" style="display:none"></div>
    </form>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBzpQxtnj2uKVoqBW8SNUWy1M3SdiVpfSg",
  authDomain: "sa-connect-844ce.firebaseapp.com",
  projectId: "sa-connect-844ce",
  storageBucket: "sa-connect-844ce.firebasestorage.app",
  messagingSenderId: "282155237764",
  appId: "1:282155237764:web:7d16d7d4d4a94687e85dd1"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const db = firebase.firestore();
const slug = (new URLSearchParams(location.search).get("slug") ||
  location.pathname.split("/").filter(Boolean).pop() || "").trim();

const businessNameEl = document.getElementById("businessName");
const pageNameEl = document.getElementById("pageName");
const leadForm = document.getElementById("leadForm");
const submitButton = document.getElementById("submitButton");
const messageEl = document.getElementById("message");

let pageConfig = null;

function showMessage(text, ok) {
  messageEl.textContent = text;
  messageEl.className = "msg " + (ok ? "success" : "error");
  messageEl.style.display = "block";
}

async function loadPage() {
  if (!slug) throw new Error("Landing page slug is missing.");

  // Query only by slug so the public landing page does not
  // require a composite Firestore index.
  const snap = await db.collection("landingPages")
    .where("slug", "==", slug)
    .limit(1)
    .get();

  if (snap.empty) {
    throw new Error("Landing page not found.");
  }

  const data = snap.docs[0].data();

  if (data.enabled !== true) {
    throw new Error("This landing page is not published.");
  }

  pageConfig = {
    clientId: String(data.clientId || "").trim(),
    slug: String(data.slug || slug).trim(),
    pageName: String(data.pageName || "Contact Us"),
    businessName: String(data.businessName || "Business")
  };

  if (!pageConfig.clientId) {
    throw new Error("Invalid landing page configuration.");
  }

  businessNameEl.textContent = pageConfig.businessName;
  pageNameEl.textContent = pageConfig.pageName;
  document.title = pageConfig.businessName + " | Enquiry";
}

leadForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!pageConfig) {
    showMessage("Landing page is not ready. Please refresh and try again.", false);
    return;
  }

  submitButton.disabled = true;
  const f = new FormData(leadForm);

  try {
    if (String(f.get("website") || "").trim()) {
      throw new Error("Unable to submit enquiry.");
    }

    const name = String(f.get("name") || "").trim();
    const phone = String(f.get("phone") || "").trim();
    const email = String(f.get("email") || "").trim();
    const city = String(f.get("city") || "").trim();
    const state = String(f.get("state") || "").trim();
    const tradingExperience = String(f.get("tradingExperience") || "").trim();
    const traderStatus = String(f.get("traderStatus") || "").trim();
    const lossExperience = String(f.get("lossExperience") || "").trim();
    const lossSegment = String(f.get("lossSegment") || "").trim();
    const tradingCapital = String(f.get("tradingCapital") || "").trim();
    const topic = String(f.get("topic") || "").trim();
    const message = String(f.get("message") || "").trim();

    if (!name || !phone || !city || !state || !tradingExperience ||
        !traderStatus || !lossExperience || !lossSegment ||
        !tradingCapital || !topic || !message) {
      throw new Error("Please fill all required fields.");
    }

    if (phone.length < 7 || phone.length > 20) {
      throw new Error("Please enter a valid mobile number.");
    }

    const leadData = {
      clientId: pageConfig.clientId,
      name: name,
      phone: phone,
      email: email,
      state: state,
      city: city,

      tradingExperience: tradingExperience,
      traderStatus: traderStatus,
      lossExperience: lossExperience,
      lossSegment: lossSegment,
      tradingCapital: tradingCapital,
      topic: topic,
      message: message,

      // CRM compatibility with the existing Android Lead model.
      requirement: message,

      source: "landing_page",
      channel: "web_form",
      status: "new",
      notes: "",
      landingPageSlug: pageConfig.slug,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection("leads").add(leadData);

    leadForm.reset();
    showMessage("Thank you. Your enquiry has been submitted successfully.", true);

  } catch (error) {
    console.error(error);
    showMessage(error.message || "Something went wrong. Please try again.", false);
  } finally {
    submitButton.disabled = false;
  }
});

loadPage().catch((error) => {
  console.error(error);
  businessNameEl.textContent = "Page unavailable";
  pageNameEl.textContent = error.message || "Unable to load this landing page.";
  submitButton.disabled = true;
});
</script>
</body>
</html>
