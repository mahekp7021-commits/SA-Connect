<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S&A Connect Lead Page</title>
<style>

<body><div class="wrap">
<div class="card hero"><div class="brand-row"><img id="logo" class="logo" style="display:none"><div class="brand">S&A CONNECT</div></div><h1 id="heroTitle">Loading...</h1><p class="sub" id="heroSubtitle">Please wait...</p><a id="heroCta" class="hero-cta" href="#leadFormCard">Get Started</a></div>
<div class="card" id="leadFormCard"><h2 id="formTitle">Trader Enquiry</h2><p class="sub" id="formSubtitle">Fill in your details and our team will contact you.</p><form id="leadForm"></form><div id="message" class="msg" style="display:none"></div></div>
<div class="muted">Powered by S&A Connect</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBzpQxtnj2uKVoqBW8SNUWy1M3SdiVpfSg",authDomain:"sa-connect-844ce.firebaseapp.com",projectId:"sa-connect-844ce",storageBucket:"sa-connect-844ce.firebasestorage.app",messagingSenderId:"282155237764",appId:"1:282155237764:web:7d16d7d4d4a94687e85dd1"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),p=new URLSearchParams(location.search),slug=(p.get("slug")||location.pathname.split("/").filter(Boolean).pop()||"").trim(),campaignId=(p.get("campaign")||"").trim(),campaignSource=(p.get("source")||"").trim().toLowerCase(),campaignMedium=(p.get("medium")||"").trim().toLowerCase();
const fields=[["name","Name","text"],["phone","Mobile","tel"],["email","Email","email"],["city","City","text"],["state","State / Union Territory","select"],["tradingExperience","Trading Experience","select"],["traderStatus","Trader Status","select"],["lossExperience","Loss Experience","select"],["lossSegment","Loss Segment","select"],["tradingCapital","Trading Capital","select"],["topic","Topic","text"],["message","Message","textarea"]];

let pageConfig=null;function msg(t,ok){const e=document.getElementById("message");e.textContent=t;e.className="msg "+(ok?"success":"error");e.style.display="block"}function addField(form,key,label,type,required){const l=document.createElement("label");l.textContent=label+(required?" *":"");form.appendChild(l);let e=type==="select"?document.createElement("select"):document.createElement(type==="textarea"?"textarea":"input");e.name=key;e.required=required;if(type!=="textarea")e.type=type;if(type==="select"){let o=document.createElement("option");o.value="";o.textContent="Select "+label;e.appendChild(o);(options[key]||[]).forEach(v=>{o=document.createElement("option");o.value=v;o.textContent=v;e.appendChild(o)})}e.maxLength=key==="message"?1000:key==="email"?160:key==="topic"?200:120;form.appendChild(e)}
async function loadPage(){if(!slug)throw Error("Landing page slug is missing.");const s=await db.collection("landingPages").doc(slug).get();if(!s.exists)throw Error("Landing page not found.");const d=s.data();if(d.enabled!==true)throw Error("This landing page is not published.");
const saved=Array.isArray(d.formFields)?d.formFields:[], map=Object.fromEntries(fields.map(x=>[x[0],x])), cfgFields=(saved.length?saved:fields.map(x=>({key:x[0],label:x[1],enabled:true}))).map(x=>{const b=map[x.key]||["name",x.label||x.key,"text"];return{key:x.key,label:x.label||b[1],type:b[2],enabled:x.enabled!==false,required:x.key==="name"||x.key==="phone"}}).filter(x=>x.enabled);
pageConfig={clientId:String(d.clientId||"").trim(),slug:String(d.slug||slug).trim(),primary:String(d.primaryColor||"#2563EB"),bg:String(d.backgroundColor||"#F5F7FB"),hero:String(d.heroTitle||d.businessName||"Get in touch with us"),heroSub:String(d.heroSubtitle||d.pageName||"Fill in your details and our team will contact you."),formTitle:String(d.formTitle||"Trader Enquiry"),formSub:String(d.formSubtitle||"Fill in your details and our team will contact you."),cta:String(d.ctaText||"Submit Enquiry"),logo:String(d.logoUrl||"").trim(),wa:String(d.whatsappNumber||"").replace(/\D/g,""),showWa:d.showWhatsApp===true,fields:cfgFields};if(!pageConfig.clientId)throw Error("Invalid landing page configuration.");
document.body.style.background=pageConfig.bg;document.getElementById("heroTitle").textContent=pageConfig.hero;document.getElementById("heroSubtitle").textContent=pageConfig.heroSub;document.getElementById("formTitle").textContent=pageConfig.formTitle;document.getElementById("formSubtitle").textContent=pageConfig.formSub;const c=document.getElementById("heroCta");c.style.background=pageConfig.primary;c.textContent=pageConfig.cta;const f=document.getElementById("leadForm");f.innerHTML="";pageConfig.fields.forEach(x=>addField(f,x.key,x.label,x.type,x.required));const hp=document.createElement("input");hp.className="hp";hp.name="website";hp.tabIndex=-1;f.appendChild(hp);const b=document.createElement("button");b.id="submitButton";b.type="submit";b.textContent=pageConfig.cta;b.style.background=pageConfig.primary;f.appendChild(b);if(pageConfig.logo){const im=document.getElementById("logo");im.src=pageConfig.logo;im.style.display="block"}if(pageConfig.showWa&&pageConfig.wa){const a=document.createElement("a");a.className="wa";a.href="https://wa.me/"+pageConfig.wa;a.target="_blank";a.rel="noopener";a.textContent="Chat with us on WhatsApp";document.getElementById("leadFormCard").appendChild(a)}c.onclick=e=>{e.preventDefault();document.getElementById("leadFormCard").scrollIntoView({behavior:"smooth"})};document.title=(d.businessName||"Business")+" | Enquiry"}
document.getElementById("leadForm").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("submitButton");b.disabled=true;const f=new FormData(e.target);try{if(String(f.get("website")||"").trim())throw Error("Unable to submit enquiry.");const data={clientId:pageConfig.clientId,name:String(f.get("name")||"").trim(),phone:String(f.get("phone")||"").trim(),email:String(f.get("email")||"").trim(),state:String(f.get("state")||"").trim(),city:String(f.get("city")||"").trim(),tradingExperience:String(f.get("tradingExperience")||"").trim(),traderStatus:String(f.get("traderStatus")||"").trim(),lossExperience:String(f.get("lossExperience")||"").trim(),lossSegment:String(f.get("lossSegment")||"").trim(),tradingCapital:String(f.get("tradingCapital")||"").trim(),topic:String(f.get("topic")||"").trim(),message:String(f.get("message")||"").trim(),requirement:String(f.get("message")||"").trim(),source:"landing_page",channel:"web_form",status:"new",notes:"",landingPageSlug:pageConfig.slug,campaignId,campaignSource,campaignMedium,createdAt:firebase.firestore.Timestamp.now()};if(data.name.length<1||data.phone.length<7)throw Error("Please enter your name and a valid mobile number.");await db.collection("leads").add(data);e.target.reset();msg("Thank you. Your enquiry has been submitted successfully.",true)}catch(err){console.error(err);msg(err.message||"Something went wrong. Please try again.",false)}finally{b.disabled=false}});
loadPage().catch(err=>{console.error(err);document.getElementById("heroTitle").textContent="Page unavailable";document.getElementById("heroSubtitle").textContent=err.message||"Unable to load this landing page.";document.getElementById("leadFormCard").style.display="none"});
</script></body></html>
